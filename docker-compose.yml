services:
  kurrentdb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:25.0.1@sha256:3d80e962fffd7a61ffbe07c41b9500a74bbd43e11e7bbee7b160fd5575b0fdea
    environment:
      KURRENTDB_CLUSTER_SIZE: 1
      KURRENTDB_RUN_PROJECTIONS: All
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"
      KURRENTDB_NODE_PORT: 2113
      KURRENTDB_INSECURE: "true"
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - "127.0.0.1:2113:2113"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    volumes:
      - kurrentdb-data:/var/lib/kurrentdb
      - kurrentdb-logs:/var/log/kurrentdb

volumes:
  kurrentdb-data:
  kurrentdb-logs:
